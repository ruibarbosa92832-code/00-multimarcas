<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00 Multimarcas - São Luís MA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<header class="bg-zinc-900 p-4 flex justify-between items-center">
<div class="font-black text-xl"><span class="text-red-600">00</span> MULTIMARCAS</div>
<a href="https://wa.me/5598984000000" class="bg-green-500 text-black px-4 py-2 rounded-full font-bold">WhatsApp</a>
</header>
<div class="text-center py-8">
<h1 class="text-3xl font-black">ESTOQUE <span class="text-red-600">00 MULTIMARCAS</span></h1>
<p class="text-zinc-400 text-sm">São Luís - MA | 15 motos disponíveis</p>
</div>
<div class="grid grid-cols-2 gap-3 p-3" id="grade"></div>
<script>
const g=document.getElementById('grade');
for(let i=1;i<=15;i++){
let n=String(i).padStart(2,'0');
g.innerHTML+=`<div class="bg-zinc-900 rounded-xl p-2"><img src="produto-${n}.jpeg" class="rounded-lg h-32 w-full object-cover"><p class="font-bold mt-2 text-sm">Moto ${n}</p><a href="https://wa.me/5598984000000?text=Ola! Tenho interesse na moto ${n}" class="block bg-white text-black text-center py-1.5 rounded-full mt-2 font-bold text-xs">Tenho Interesse</a></div>`;
}
</script>
</div>
</body>
</html>
