<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BERMUDA PREMIUM - 00 MULTIMARCAS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>.font-anton{font-family:'Anton',sans-serif}.font-cinzel{font-family:'Cinzel',serif}.gold-gradient{background:linear-gradient(135deg,#FFD700,#D4AF37,#B8860B);color:#000}.gold-border{border:1.5px solid #D4AF37}.gold-text{background:linear-gradient(135deg,#FFD700,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}</style>
</head>
<body class="bg-black text-white font-anton">
<header class="fixed top-0 w-full bg-black/95 border-b border-[#D4AF37]/30 z-50 flex justify-between items-center px-4 py-3">
  <a href="index.html" class="flex items-center gap-2"><img src="logo.PNG" onerror="this.src='logo.png'" class="h-8"><span class="font-cinzel text-[#D4AF37] text-sm">00 MULTIMARCAS</span></a>
  <div class="flex items-center gap-3">
    <a href="carrinho.html" class="relative w-11 h-11 bg-black gold-border flex items-center justify-center text-[#D4AF37] rounded-full text-xl">🛒<span id="cartCount" class="absolute -top-1 -right-1 bg-[#FFD700] text-black text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-black hidden">0</span></a>
    <div class="relative"><button id="menuBtn" class="w-11 h-11 bg-black gold-border flex items-center justify-center text-[#D4AF37] text-2xl rounded-full">⋮</button><div id="menuDrop" class="hidden absolute right-0 top-14 bg-[#0f0f0f] gold-border w-72 py-2 z-50"><a href="index.html" class="block px-5 py-4 text-white font-cinzel text-sm">🏠 INÍCIO</a><a href="camisas.html" class="block px-5 py-4 text-white font-cinzel text-sm border-t border-[#D4AF37]/10">👕 CAMISA</a><a href="bermudas.html" class="block px-5 py-4 text-[#D4AF37] bg-[#D4AF37]/10 font-cinzel text-sm border-t border-[#D4AF37]/10">🩳 BERMUDA</a><a href="carrinho.html" class="block px-5 py-4 text-white font-cinzel text-sm border-t border-[#D4AF37]/10">🛒 CARRINHO</a></div></div>
  </div>
</header>
<section class="pt-24 px-3 pb-20">
  <h1 class="font-cinzel text-center text-4xl gold-text">BERMUDA PREMIUM</h1>
  <p class="font-cinzel text-center text-[#D4AF37]/60 tracking-[0.3em] text-[10px] mt-1">R$65 • 38 AO 48</p>
  <div class="grid grid-cols-2 gap-3 max-w-5xl mx-auto mt-8">
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda1.jpg" onerror="this.onerror=null; this.src='bermuda1.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda1.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda2.jpg" onerror="this.onerror=null; this.src='bermuda2.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda2.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda3.jpg" onerror="this.onerror=null; this.src='bermuda3.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda3.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda4.jpg" onerror="this.onerror=null; this.src='bermuda4.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda4.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda5.jpg" onerror="this.onerror=null; this.src='bermuda5.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda5.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
    <div class="bg-[#0f0f0f] gold-border p-2"><img src="bermuda6.jpg" onerror="this.onerror=null; this.src='bermuda6.JPG'" class="w-full h-56 object-cover bg-zinc-900"><h3 class="font-cinzel text-[#D4AF37] text-xs mt-2">BERMUDA PREMIUM</h3><p class="text-[#FFD700] text-xl">R$ 65</p><button onclick="addCart('BERMUDA PREMIUM',65,'bermuda6.jpg')" class="w-full gold-gradient py-2 mt-2 font-black text-xs">+ CARRINHO</button></div>
  </div>
</section>
<script>
function addCart(n,p,i){let c=JSON.parse(localStorage.getItem('cart00')||'[]');c.push({nome:n,preco:p,img:i});localStorage.setItem('cart00',JSON.stringify(c));updateCount();alert('Adicionado! 🛒');}
function updateCount(){let c=JSON.parse(localStorage.getItem('cart00')||'[]');let el=document.getElementById('cartCount');if(c.length>0){el.classList.remove('hidden');el.innerText=c.length;}}
const btn=document.getElementById('menuBtn'),drop=document.getElementById('menuDrop');btn.onclick=(e)=>{e.stopPropagation();drop.classList.toggle('hidden');};document.onclick=()=>drop.classList.add('hidden');updateCount();
</script>
</body>
</html>
